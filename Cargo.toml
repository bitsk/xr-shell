[package]
name = "xr-shell"
version = "0.2.10"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rust OpenXR spatial shell for UKUI XR"

[workspace]
members = ["protocols"]

[dependencies]
xr-shell-protocols = { path = "protocols" }
xr-spatial-kit = { path = "../xr-spatial-kit" }
libc = "0.2"
anyhow = "1"
ash = { version = "0.38", default-features = false, features = ["loaded", "debug", "std"] }
openxr = "=0.22.0"
ctrlc = { version = "3", features = ["termination"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = "thin"
